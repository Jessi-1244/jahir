<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Nur&Afiq Recycling | Sign In</title>
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="../assets/images/favicon.ico" />
    <link rel="stylesheet" href="../assets/css/backend-plugin.min.css">
    <link rel="stylesheet" href="../assets/css/backend.css?v=1.0.0">
    <link rel="stylesheet" href="../assets/vendor/@fortawesome/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="../assets/vendor/line-awesome/dist/line-awesome/css/line-awesome.min.css">
    <link rel="stylesheet" href="../assets/vendor/remixicon/fonts/remixicon.css">
    <script src="authcheck.js"></script>
  </head>
  <body>
    <div class="wrapper">
      <section class="login-content">
        <div class="container">
          <div class="row align-items-center justify-content-center height-self-center">
            <div class="col-lg-8">
              <div class="card auth-card">
                <div class="card-body p-0">
                  <div class="d-flex align-items-center auth-content">
                    <div class="col-lg-7 align-self-center">
                      <div class="p-3">
                        <h2 class="mb-2">Sign In to Nur&Afiq Recycling Accounting Software</h2>
                        <p>Login to track your purchases, sales, and expenses efficiently.</p>
                        <form id="loginForm">
                          <div class="row">
                            <div class="col-lg-12">
                              <div class="floating-label form-group">
                                <input id="email" class="floating-input form-control" type="email" placeholder=" " required>
                                <label>Email</label>
                              </div>
                            </div>
                            <div class="col-lg-12">
                              <div class="floating-label form-group">
                                <input id="password" class="floating-input form-control" type="password" placeholder=" " required>
                                <label>Password</label>
                              </div>
                            </div>
                          </div>
                          <button type="submit" class="btn btn-primary">Sign In</button>
                        </form>
                        <!-- Error message container -->
                        <div id="error-message" class="error-message" style="display: none;">Invalid credentials, please try again.</div>
                      </div>
                    </div>
                    <div class="col-lg-5 content-right">
                      <!-- Update the image source here -->
                      <img src="../assets/images/login/Login-Image.svg" class="img-fluid image-right" alt="Tracker Image">
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- Firebase SDK (Modular version) -->
    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js';
      import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js';

      const firebaseConfig = {
        apiKey: "AIzaSyDEgnecR63RJ_pe-2r4pOnpEDv5qLUl2jU",
        authDomain: "nurafiq-recycling.firebaseapp.com",
        databaseURL: "https://nurafiq-recycling-default-rtdb.firebaseio.com",
        projectId: "nurafiq-recycling",
        storageBucket: "nurafiq-recycling.appspot.com",
        messagingSenderId: "1234567890",
        appId: "1:1234567890:web:abcdef123456"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        signInWithEmailAndPassword(auth, email, password)
          .then((userCredential) => {
            const user = userCredential.user;
            localStorage.setItem('loggedIn', 'true');
            
            // Redirect based on the stored URL
            const redirectPage = sessionStorage.getItem('redirectAfterLogin');
            if (redirectPage) {
                window.location.replace(redirectPage);
                sessionStorage.removeItem('redirectAfterLogin');
            } else {
                window.location.replace('index.html');
            }
          })
          .catch((error) => {
            const errorMessage = error.message;
            document.getElementById('error-message').style.display = 'block';
            document.getElementById('error-message').innerText = errorMessage;
          });
      });
    </script>
  </body>
</html>
